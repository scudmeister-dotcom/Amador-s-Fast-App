<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canvas Pinball</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e2644, #070a17 55%);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .game-shell {
      display: grid;
      gap: 10px;
      justify-items: center;
      color: #e8edff;
      text-align: center;
    }
    canvas {
      border: 3px solid #7e8ccf;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      background: linear-gradient(#101b31, #0a1222);
      max-width: min(92vw, 540px);
      height: auto;
    }
    .hud {
      display: flex;
      gap: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls {
      opacity: 0.9;
      font-size: 0.95rem;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #08112a;
      background: linear-gradient(180deg, #adbcff, #89a0ff);
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>Pinball</h1>
    <div class="hud">
      <span id="score">Score: 0</span>
      <span id="balls">Balls: 3</span>
      <span id="status">Press Space to launch</span>
    </div>
    <canvas id="game" width="420" height="680" aria-label="Pinball game"></canvas>
    <button id="restart">Restart Game</button>
    <div class="controls">Controls: ⬅️ / ⬇️ left flipper, ➡️ / ⬆️ right flipper, Space launch</div>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const ballsEl = document.getElementById('balls');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');

    const keys = new Set();

    const game = {
      width: canvas.width,
      height: canvas.height,
      gravity: 0.22,
      drag: 0.997,
      score: 0,
      balls: 3,
      launched: false,
      canLaunch: true,
      gameOver: false,
      plungerPower: 0,
      plungerDirection: 1,
      bumpers: [
        { x: 125, y: 160, r: 26, value: 25, color: '#ff5f78' },
        { x: 285, y: 170, r: 22, value: 35, color: '#ffd166' },
        { x: 208, y: 245, r: 24, value: 45, color: '#7ef7c4' },
      ],
      walls: [
        { x1: 35, y1: 30, x2: 35, y2: 640 },
        { x1: 35, y1: 30, x2: 352, y2: 30 },
        { x1: 352, y1: 30, x2: 352, y2: 640 },
        { x1: 35, y1: 640, x2: 170, y2: 640 },
        { x1: 248, y1: 640, x2: 352, y2: 640 },
        { x1: 280, y1: 30, x2: 352, y2: 150 },
      ],
      leftFlipper: {
        pivotX: 150,
        pivotY: 612,
        length: 82,
        width: 16,
        restAngle: -0.48,
        activeAngle: 0.25,
        angle: -0.48,
      },
      rightFlipper: {
        pivotX: 230,
        pivotY: 612,
        length: 82,
        width: 16,
        restAngle: Math.PI + 0.48,
        activeAngle: Math.PI - 0.25,
        angle: Math.PI + 0.48,
      },
      ball: {
        x: 378,
        y: 596,
        vx: 0,
        vy: 0,
        r: 10,
      },
    };

    const flashTexts = [];

    function resetBall() {
      game.ball.x = 378;
      game.ball.y = 596;
      game.ball.vx = 0;
      game.ball.vy = 0;
      game.launched = false;
      game.canLaunch = true;
      game.plungerPower = 0;
      statusEl.textContent = game.gameOver ? 'Game Over' : 'Press Space to launch';
    }

    function resetGame() {
      game.score = 0;
      game.balls = 3;
      game.gameOver = false;
      flashTexts.length = 0;
      resetBall();
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = `Score: ${game.score}`;
      ballsEl.textContent = `Balls: ${game.balls}`;
    }

    function drawWall(w) {
      ctx.strokeStyle = '#9eb2ff';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w.x1, w.y1);
      ctx.lineTo(w.x2, w.y2);
      ctx.stroke();
    }

    function drawBumper(b) {
      const g = ctx.createRadialGradient(b.x - 6, b.y - 6, 5, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.2, b.color);
      g.addColorStop(1, '#263f84');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c7d7ff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawFlipper(flipper, isLeft) {
      const x2 = flipper.pivotX + Math.cos(flipper.angle) * flipper.length;
      const y2 = flipper.pivotY + Math.sin(flipper.angle) * flipper.length;

      ctx.strokeStyle = '#ff9fb8';
      ctx.lineCap = 'round';
      ctx.lineWidth = flipper.width;
      ctx.beginPath();
      ctx.moveTo(flipper.pivotX, flipper.pivotY);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.fillStyle = isLeft ? '#ffc2d2' : '#ffd7e2';
      ctx.beginPath();
      ctx.arc(flipper.pivotX, flipper.pivotY, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall() {
      ctx.fillStyle = '#f1f4ff';
      ctx.beginPath();
      ctx.arc(game.ball.x, game.ball.y, game.ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a9b8ef';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPlunger() {
      ctx.fillStyle = '#2c385f';
      ctx.fillRect(365, 70, 28, 570);
      ctx.fillStyle = '#8195df';
      const h = 20 + game.plungerPower * 45;
      ctx.fillRect(366, 620 - h, 26, h);
    }

    function handleInput() {
      const leftPressed = keys.has('ArrowLeft') || keys.has('ArrowDown');
      const rightPressed = keys.has('ArrowRight') || keys.has('ArrowUp');
      game.leftFlipper.angle += ((leftPressed ? game.leftFlipper.activeAngle : game.leftFlipper.restAngle) - game.leftFlipper.angle) * 0.35;
      game.rightFlipper.angle += ((rightPressed ? game.rightFlipper.activeAngle : game.rightFlipper.restAngle) - game.rightFlipper.angle) * 0.35;

      if (!game.launched && game.canLaunch && !game.gameOver) {
        game.plungerPower += 0.01 * game.plungerDirection;
        if (game.plungerPower > 1) {
          game.plungerPower = 1;
          game.plungerDirection = -1;
        } else if (game.plungerPower < 0.1) {
          game.plungerPower = 0.1;
          game.plungerDirection = 1;
        }
      }

      if (keys.has(' ') && game.canLaunch && !game.gameOver) {
        game.canLaunch = false;
        game.launched = true;
        game.ball.vx = -1.5 - game.plungerPower * 1.2;
        game.ball.vy = -8 - game.plungerPower * 4.5;
        statusEl.textContent = 'Ball in play';
      }
    }

    function addPoints(points, x, y) {
      game.score += points;
      updateHud();
      flashTexts.push({ text: `+${points}`, x, y, life: 40 });
    }

    function collideWall(w) {
      const { x, y, r } = game.ball;
      const dx = w.x2 - w.x1;
      const dy = w.y2 - w.y1;
      const t = Math.max(0, Math.min(1, ((x - w.x1) * dx + (y - w.y1) * dy) / (dx * dx + dy * dy)));
      const px = w.x1 + t * dx;
      const py = w.y1 + t * dy;
      const distX = x - px;
      const distY = y - py;
      const dist2 = distX * distX + distY * distY;

      if (dist2 < r * r) {
        const dist = Math.sqrt(dist2) || 0.001;
        const nx = distX / dist;
        const ny = distY / dist;

        const dot = game.ball.vx * nx + game.ball.vy * ny;
        game.ball.vx -= 2 * dot * nx;
        game.ball.vy -= 2 * dot * ny;

        game.ball.x = px + nx * (r + 0.2);
        game.ball.y = py + ny * (r + 0.2);
      }
    }

    function collideBumper(bumper) {
      const dx = game.ball.x - bumper.x;
      const dy = game.ball.y - bumper.y;
      const d = Math.hypot(dx, dy);
      const minDist = game.ball.r + bumper.r;
      if (d < minDist) {
        const nx = dx / (d || 0.001);
        const ny = dy / (d || 0.001);
        const speed = Math.hypot(game.ball.vx, game.ball.vy) + 0.5;
        game.ball.vx = nx * speed;
        game.ball.vy = ny * speed;
        game.ball.x = bumper.x + nx * (minDist + 0.2);
        game.ball.y = bumper.y + ny * (minDist + 0.2);
        addPoints(bumper.value, bumper.x - 12, bumper.y - bumper.r - 10);
      }
    }

    function collideFlipper(flipper, isLeft) {
      const x1 = flipper.pivotX;
      const y1 = flipper.pivotY;
      const x2 = x1 + Math.cos(flipper.angle) * flipper.length;
      const y2 = y1 + Math.sin(flipper.angle) * flipper.length;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const t = Math.max(0, Math.min(1, ((game.ball.x - x1) * dx + (game.ball.y - y1) * dy) / (dx * dx + dy * dy)));
      const px = x1 + t * dx;
      const py = y1 + t * dy;
      const distX = game.ball.x - px;
      const distY = game.ball.y - py;
      const dist = Math.hypot(distX, distY);

      if (dist < game.ball.r + flipper.width * 0.45) {
        const nx = distX / (dist || 0.001);
        const ny = distY / (dist || 0.001);
        const fling = 7.8 + Math.abs(flipper.angle - (isLeft ? flipper.restAngle : flipper.restAngle)) * 5;
        game.ball.vx += nx * fling + (isLeft ? -0.8 : 0.8);
        game.ball.vy = Math.min(game.ball.vy, -Math.abs(ny * fling) - 2.2);
        game.ball.x = px + nx * (game.ball.r + flipper.width * 0.45 + 0.2);
        game.ball.y = py + ny * (game.ball.r + flipper.width * 0.45 + 0.2);
      }
    }

    function updatePhysics() {
      if (!game.launched || game.gameOver) return;

      game.ball.vy += game.gravity;
      game.ball.vx *= game.drag;
      game.ball.vy *= game.drag;

      game.ball.x += game.ball.vx;
      game.ball.y += game.ball.vy;

      for (const wall of game.walls) collideWall(wall);
      for (const bumper of game.bumpers) collideBumper(bumper);
      collideFlipper(game.leftFlipper, true);
      collideFlipper(game.rightFlipper, false);

      if (game.ball.y - game.ball.r > game.height + 24) {
        game.balls -= 1;
        updateHud();
        if (game.balls <= 0) {
          game.gameOver = true;
          statusEl.textContent = 'Game Over - Press Restart';
        } else {
          statusEl.textContent = 'Ball drained - Press Space to launch';
        }
        resetBall();
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, game.width, game.height);
      ctx.fillStyle = '#0d1730';
      ctx.fillRect(0, 0, game.width, game.height);

      ctx.fillStyle = '#151f3a';
      ctx.beginPath();
      ctx.moveTo(35, 640);
      ctx.lineTo(170, 640);
      ctx.lineTo(205, 615);
      ctx.lineTo(248, 640);
      ctx.lineTo(352, 640);
      ctx.lineTo(352, 675);
      ctx.lineTo(35, 675);
      ctx.closePath();
      ctx.fill();
    }

    function drawFlashTexts() {
      for (let i = flashTexts.length - 1; i >= 0; i -= 1) {
        const txt = flashTexts[i];
        ctx.fillStyle = `rgba(241, 245, 255, ${txt.life / 40})`;
        ctx.font = 'bold 16px Inter, sans-serif';
        ctx.fillText(txt.text, txt.x, txt.y - (40 - txt.life) * 0.7);
        txt.life -= 1;
        if (txt.life <= 0) flashTexts.splice(i, 1);
      }
    }

    function render() {
      drawBackground();
      for (const wall of game.walls) drawWall(wall);
      for (const bumper of game.bumpers) drawBumper(bumper);
      drawPlunger();
      drawFlipper(game.leftFlipper, true);
      drawFlipper(game.rightFlipper, false);
      drawBall();
      drawFlashTexts();
    }

    function tick() {
      handleInput();
      updatePhysics();
      render();
      requestAnimationFrame(tick);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
        e.preventDefault();
      }
      keys.add(e.key);
    });

    window.addEventListener('keyup', (e) => {
      keys.delete(e.key);
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    tick();
  </script>
</body>
</html>
